# FitMeet corporate website. Install as /etc/nginx/conf.d/fitmeet.cn.conf.
# The certificate paths deliberately cover only fitmeet.cn and www.fitmeet.cn.

server {
  listen 80;
  listen [::]:80;
  server_name fitmeet.cn www.fitmeet.cn;

  return 301 https://fitmeet.cn$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.fitmeet.cn;

  ssl_certificate     /etc/nginx/ssl/fitmeet.cn/fitmeet.cn.pem;
  ssl_certificate_key /etc/nginx/ssl/fitmeet.cn/fitmeet.cn.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://fitmeet.cn$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name fitmeet.cn;

  ssl_certificate     /etc/nginx/ssl/fitmeet.cn/fitmeet.cn.pem;
  ssl_certificate_key /etc/nginx/ssl/fitmeet.cn/fitmeet.cn.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
